<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e64c8"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="190" y="14" text-anchor="middle" font-family="Candara, sans-serif" font-size="10" fill="#1e64c8" font-weight="bold">RDF 1.2 OR-Set Representation</text>

  <!-- Code block background -->
  <rect x="10" y="22" width="360" height="112" rx="6" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>

  <!-- Line 1: container triple -->
  <text x="18" y="38" font-family="monospace" font-size="7.5" fill="#333">&lt;&gt; a crdt:container .</text>

  <!-- Line 2-3: container tagger -->
  <text x="18" y="51" font-family="monospace" font-size="7.5" fill="#333">[] crdt:tags &lt;&lt;( &lt;&gt; a crdt:container )&gt;&gt; ;</text>
  <text x="30" y="62" font-family="monospace" font-size="7.5" fill="#2e7d32">   crdt:add "be2f95dd-..."^^crdt:uuid .</text>

  <!-- Line 4: data triple -->
  <text x="18" y="77" font-family="monospace" font-size="7.5" fill="#1e64c8" font-weight="bold">:me a :human .</text>

  <!-- Line 5-7: tagger with add + remove -->
  <text x="18" y="88" font-family="monospace" font-size="7.5" fill="#333">[] crdt:tags &lt;&lt;( :me a :human )&gt;&gt; ;</text>
  <text x="30" y="99" font-family="monospace" font-size="7.5" fill="#2e7d32">   crdt:add "96d482e5-..."^^crdt:uuid ;</text>
  <text x="30" y="110" font-family="monospace" font-size="7.5" fill="#c62828">   crdt:remove "77c01067-..."^^crdt:uuid .</text>

  <!-- Line 8-9: tombstone-only triple -->
  <text x="18" y="125" font-family="monospace" font-size="7.5" fill="#888">[] crdt:tags &lt;&lt;( :me a :man )&gt;&gt; ;</text>
  <text x="30" y="136" font-family="monospace" font-size="7.5" fill="#c62828">   crdt:remove "216ac011-...--2025-03-13T14:00:00Z"^^crdt:stamp-uuid .</text>

  <!-- Annotations -->
  <!-- Present triple annotation -->
  <rect x="10" y="146" width="175" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="97" y="161" text-anchor="middle" font-family="Candara, sans-serif" font-size="8.5" fill="#2e7d32" font-weight="bold">✓ :me a :human — present</text>
  <text x="97" y="174" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">Has add-tag not in tombstone set</text>
  <text x="97" y="186" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">→ add-wins over concurrent remove</text>

  <!-- Absent triple annotation -->
  <rect x="195" y="146" width="175" height="50" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.2"/>
  <text x="282" y="161" text-anchor="middle" font-family="Candara, sans-serif" font-size="8.5" fill="#c62828" font-weight="bold">✗ :me a :man — absent</text>
  <text x="282" y="174" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">No add-tags remain</text>
  <text x="282" y="186" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">stamp-uuid enables tombstone expiry</text>
</svg>
