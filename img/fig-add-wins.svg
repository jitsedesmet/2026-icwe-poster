<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 145">
  <!-- Timeline -->
  <line x1="20" y1="25" x2="350" y2="25" stroke="#ccc" stroke-width="1"/>
  <line x1="20" y1="70" x2="350" y2="70" stroke="#ccc" stroke-width="1"/>
  <text x="8" y="28" font-family="Candara, sans-serif" font-size="9" fill="#1e64c8" font-weight="bold">A</text>
  <text x="8" y="73" font-family="Candara, sans-serif" font-size="9" fill="#1e64c8" font-weight="bold">B</text>

  <!-- Time arrow -->
  <text x="185" y="10" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#6b7280">time →</text>

  <!-- Step 1: Both have triple synced -->
  <rect x="30" y="17" width="50" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="55" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#2e7d32">add t</text>
  <rect x="30" y="62" width="50" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="55" y="73" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#2e7d32">sync</text>

  <!-- Sync arrow -->
  <line x1="55" y1="33" x2="55" y2="60" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Step 2: A removes, B re-adds (concurrent, no sync) -->
  <rect x="110" y="17" width="55" height="16" rx="3" fill="#ffebee" stroke="#c62828" stroke-width="1"/>
  <text x="137" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#c62828">remove t</text>
  <rect x="110" y="62" width="55" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="137" y="73" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#2e7d32">add t</text>

  <!-- No sync marker -->
  <text x="137" y="50" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#c62828">✗ no sync</text>

  <!-- Step 3: Merge -->
  <rect x="195" y="17" width="50" height="16" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="220" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#7b1fa2">merge</text>
  <rect x="195" y="62" width="50" height="16" rx="3" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1"/>
  <text x="220" y="73" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#7b1fa2">merge</text>

  <line x1="220" y1="33" x2="220" y2="60" stroke="#7b1fa2" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Step 4: Result — add wins -->
  <rect x="275" y="17" width="65" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="307" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#2e7d32" font-weight="bold">t visible ✓</text>
  <rect x="275" y="62" width="65" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="307" y="73" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#2e7d32" font-weight="bold">t visible ✓</text>

  <!-- Legend -->
  <rect x="20" y="100" width="330" height="38" rx="6" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>
  <text x="185" y="115" text-anchor="middle" font-family="Candara, sans-serif" font-size="9" fill="#1e64c8" font-weight="bold">Add-wins guarantee</text>
  <text x="185" y="130" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#333">Concurrent add + remove → the add always wins. Both replicas converge.</text>
</svg>
