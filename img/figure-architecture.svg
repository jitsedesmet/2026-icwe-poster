<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 210" font-family="Candara, sans-serif">
  <!-- The Web -->
  <rect x="60" y="5" width="140" height="30" rx="6" fill="#1e64c8"/>
  <text x="130" y="25" text-anchor="middle" fill="white" font-size="13" font-weight="bold">The Web</text>

  <!-- Arrows between Web and CRDT Store -->
  <line x1="95" y1="35" x2="95" y2="58" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="91,58 95,66 99,58" fill="#6b7280"/>
  <text x="78" y="52" text-anchor="end" fill="#6b7280" font-size="9">ETag GET</text>
  <line x1="165" y1="58" x2="165" y2="35" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="161,35 165,27 169,35" fill="#6b7280"/>
  <text x="182" y="52" text-anchor="start" fill="#6b7280" font-size="9">Cond. PUT</text>

  <!-- CRDT Store -->
  <rect x="45" y="66" width="170" height="32" rx="6" fill="#e26c22"/>
  <text x="130" y="87" text-anchor="middle" fill="white" font-size="13" font-weight="bold">CRDT Store</text>

  <!-- Arrow down -->
  <line x1="130" y1="98" x2="130" y2="114" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="126,114 130,122 134,114" fill="#6b7280"/>

  <!-- SPARQL Engine -->
  <rect x="35" y="122" width="190" height="32" rx="6" fill="#1e64c8" opacity="0.85"/>
  <text x="130" y="143" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SPARQL Engine</text>

  <!-- Arrow down -->
  <line x1="130" y1="154" x2="130" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="126,170 130,178 134,170" fill="#6b7280"/>

  <!-- Agent (person icon using shapes) -->
  <circle cx="130" cy="186" r="6" fill="#1e64c8"/>
  <path d="M118,207 Q118,195 130,195 Q142,195 142,207" fill="#1e64c8"/>
  <text x="170" y="200" fill="#1e64c8" font-size="12" font-weight="bold">Agent</text>
</svg>
