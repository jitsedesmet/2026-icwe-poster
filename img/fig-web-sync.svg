<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e64c8"/>
    </marker>
    <marker id="arr-w" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e26c22"/>
    </marker>
  </defs>

  <!-- Agent A -->
  <rect x="8" y="10" width="105" height="90" rx="10" fill="#eef4fc" stroke="#1e64c8" stroke-width="1.5"/>
  <text x="60" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="10" fill="#1e64c8" font-weight="bold">Agent A</text>
  <rect x="18" y="35" width="85" height="18" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="60" y="48" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">SPARQL Engine</text>
  <rect x="18" y="58" width="85" height="18" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="60" y="71" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#333">CRDT-aware Store</text>
  <text x="60" y="95" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#6b7280">works offline ✓</text>

  <!-- Agent B -->
  <rect x="268" y="10" width="105" height="90" rx="10" fill="#eef4fc" stroke="#1e64c8" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="10" fill="#1e64c8" font-weight="bold">Agent B</text>
  <rect x="278" y="35" width="85" height="18" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="320" y="48" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">SPARQL Engine</text>
  <rect x="278" y="58" width="85" height="18" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="320" y="71" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#333">CRDT-aware Store</text>
  <text x="320" y="95" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#6b7280">works offline ✓</text>

  <!-- Server -->
  <rect x="128" y="115" width="125" height="48" rx="10" fill="#fff3e0" stroke="#e26c22" stroke-width="1.5"/>
  <text x="190" y="132" text-anchor="middle" font-family="Candara, sans-serif" font-size="9" fill="#e26c22" font-weight="bold">RDF-over-HTTP</text>
  <text x="190" y="145" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#333">N-Quads + ETag support</text>
  <text x="190" y="157" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#6b7280">e.g. Solid Pod, any Web server</text>

  <!-- Arrows: Agent A → Server (PUT with If-Match) -->
  <line x1="75" y1="100" x2="148" y2="118" stroke="#1e64c8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="88" y="115" font-family="Candara, sans-serif" font-size="6.5" fill="#1e64c8">PUT + If-Match</text>

  <!-- Arrows: Server → Agent A (GET + ETag) -->
  <line x1="140" y1="128" x2="85" y2="100" stroke="#e26c22" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-w)"/>
  <text x="88" y="126" font-family="Candara, sans-serif" font-size="6.5" fill="#e26c22">GET + ETag</text>

  <!-- Arrows: Agent B → Server -->
  <line x1="305" y1="100" x2="238" y2="118" stroke="#1e64c8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="268" y="115" font-family="Candara, sans-serif" font-size="6.5" fill="#1e64c8">PUT + If-Match</text>

  <!-- Arrows: Server → Agent B -->
  <line x1="245" y1="128" x2="295" y2="100" stroke="#e26c22" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-w)"/>
  <text x="268" y="126" font-family="Candara, sans-serif" font-size="6.5" fill="#e26c22">GET + ETag</text>

  <!-- Merge label in middle -->
  <rect x="148" y="38" width="85" height="42" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="190" y="53" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#2e7d32" font-weight="bold">State-based Merge</text>
  <text x="190" y="65" text-anchor="middle" font-family="Candara, sans-serif" font-size="6.5" fill="#333">commutative, assoc.</text>
  <text x="190" y="75" text-anchor="middle" font-family="Candara, sans-serif" font-size="6.5" fill="#333">idempotent</text>

  <!-- Arrows between agents and merge -->
  <line x1="113" y1="55" x2="145" y2="57" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <line x1="268" y1="55" x2="236" y2="57" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
</svg>
