<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" font-family="Candara, sans-serif" font-size="11">
  <!-- Background -->
  <rect width="560" height="200" fill="#f8f9fa" rx="6"/>

  <!-- Title -->
  <text x="280" y="18" text-anchor="middle" font-weight="700" font-size="12" fill="#1e64c8">State-Based Web Synchronization</text>

  <!-- Client A box -->
  <rect x="20" y="30" width="120" height="140" rx="8" fill="white" stroke="#1e64c8" stroke-width="2"/>
  <rect x="20" y="30" width="120" height="22" rx="8" fill="#1e64c8"/>
  <text x="80" y="45" text-anchor="middle" fill="white" font-weight="700" font-size="10">Agent A</text>
  <text x="80" y="70" text-anchor="middle" fill="#333" font-size="9">local OR-Set</text>
  <rect x="30" y="78" width="100" height="30" rx="4" fill="#eef4fc" stroke="#1e64c8" stroke-width="1"/>
  <text x="80" y="96" text-anchor="middle" fill="#1e64c8" font-size="9" font-weight="600">state S₁</text>
  <text x="80" y="125" text-anchor="middle" fill="#555" font-size="9">ETag: "abc123"</text>
  <text x="80" y="145" text-anchor="middle" fill="#333" font-size="9">SPARQL read/write</text>
  <text x="80" y="160" text-anchor="middle" fill="#555" font-size="8">via standard endpoint</text>

  <!-- Server / Solid Pod -->
  <rect x="200" y="30" width="160" height="140" rx="8" fill="white" stroke="#555" stroke-width="2"/>
  <rect x="200" y="30" width="160" height="22" rx="8" fill="#555"/>
  <text x="280" y="45" text-anchor="middle" fill="white" font-weight="700" font-size="10">Solid Pod / HTTP Server</text>
  <text x="280" y="70" text-anchor="middle" fill="#333" font-size="9">shared OR-Set resource</text>
  <rect x="210" y="78" width="140" height="30" rx="4" fill="#f5f5f5" stroke="#888" stroke-width="1"/>
  <text x="280" y="96" text-anchor="middle" fill="#444" font-size="9" font-weight="600">state Sₛ + ETag</text>
  <text x="280" y="125" text-anchor="middle" fill="#555" font-size="9">GET → return state + ETag</text>
  <text x="280" y="143" text-anchor="middle" fill="#555" font-size="9">PUT + If-Match → merge</text>
  <text x="280" y="161" text-anchor="middle" fill="#888" font-size="8">412 if ETag mismatch</text>

  <!-- Client B box -->
  <rect x="420" y="30" width="120" height="140" rx="8" fill="white" stroke="#e26c22" stroke-width="2"/>
  <rect x="420" y="30" width="120" height="22" rx="8" fill="#e26c22"/>
  <text x="480" y="45" text-anchor="middle" fill="white" font-weight="700" font-size="10">Agent B</text>
  <text x="480" y="70" text-anchor="middle" fill="#333" font-size="9">local OR-Set</text>
  <rect x="430" y="78" width="100" height="30" rx="4" fill="#fff3e0" stroke="#e26c22" stroke-width="1"/>
  <text x="480" y="96" text-anchor="middle" fill="#e26c22" font-size="9" font-weight="600">state S₂</text>
  <text x="480" y="125" text-anchor="middle" fill="#555" font-size="9">ETag: "def456"</text>
  <text x="480" y="145" text-anchor="middle" fill="#333" font-size="9">SPARQL read/write</text>
  <text x="480" y="160" text-anchor="middle" fill="#555" font-size="8">unaware of CRDT</text>

  <!-- Arrows A to Server -->
  <!-- GET arrow -->
  <line x1="140" y1="80" x2="198" y2="80" stroke="#1e64c8" stroke-width="1.5" marker-end="url(#blue-arr)"/>
  <text x="169" y="75" text-anchor="middle" fill="#1e64c8" font-size="8">GET</text>
  <!-- PUT arrow -->
  <line x1="140" y1="110" x2="198" y2="110" stroke="#e26c22" stroke-width="1.5" marker-end="url(#orange-arr)"/>
  <text x="158" y="105" text-anchor="middle" fill="#e26c22" font-size="8">PUT+merge</text>
  <text x="158" y="122" text-anchor="middle" fill="#e26c22" font-size="7">If-Match: ETag</text>

  <!-- Arrows B to Server -->
  <line x1="420" y1="80" x2="362" y2="80" stroke="#1e64c8" stroke-width="1.5" marker-end="url(#blue-arr)"/>
  <text x="391" y="75" text-anchor="middle" fill="#1e64c8" font-size="8">GET</text>
  <line x1="420" y1="110" x2="362" y2="110" stroke="#e26c22" stroke-width="1.5" marker-end="url(#orange-arr)"/>
  <text x="401" y="105" text-anchor="middle" fill="#e26c22" font-size="8">PUT+merge</text>
  <text x="401" y="122" text-anchor="middle" fill="#e26c22" font-size="7">If-Match: ETag</text>

  <!-- Conflict-free label -->
  <rect x="190" y="178" width="180" height="18" rx="4" fill="#d4edda" stroke="#28a745" stroke-width="1"/>
  <text x="280" y="191" text-anchor="middle" fill="#28a745" font-size="9" font-weight="700">✓ Conflict-free — no coordinator needed</text>

  <defs>
    <marker id="blue-arr" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#1e64c8"/>
    </marker>
    <marker id="orange-arr" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#e26c22"/>
    </marker>
  </defs>
</svg>
