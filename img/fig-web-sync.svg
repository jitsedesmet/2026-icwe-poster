<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 170">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1e64c8"/>
    </marker>
    <marker id="arr-w" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e26c22"/>
    </marker>
  </defs>

  <!-- Client A -->
  <rect x="8" y="10" width="105" height="95" rx="10" fill="#eef4fc" stroke="#1e64c8" stroke-width="1.5"/>
  <text x="60" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="10" fill="#1e64c8" font-weight="bold">Client A</text>
  <rect x="18" y="35" width="85" height="20" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="60" y="49" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#333">CrdtStore</text>
  <rect x="18" y="62" width="85" height="20" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="60" y="76" text-anchor="middle" font-family="monospace" font-size="7" fill="#333">WebSyncedStore</text>
  <text x="60" y="100" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#6b7280">works offline ✓</text>

  <!-- Client B -->
  <rect x="268" y="10" width="105" height="95" rx="10" fill="#eef4fc" stroke="#1e64c8" stroke-width="1.5"/>
  <text x="320" y="28" text-anchor="middle" font-family="Candara, sans-serif" font-size="10" fill="#1e64c8" font-weight="bold">Client B</text>
  <rect x="278" y="35" width="85" height="20" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="320" y="49" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#333">CrdtStore</text>
  <rect x="278" y="62" width="85" height="20" rx="4" fill="white" stroke="#1e64c8" stroke-width="1"/>
  <text x="320" y="76" text-anchor="middle" font-family="monospace" font-size="7" fill="#333">WebSyncedStore</text>
  <text x="320" y="100" text-anchor="middle" font-family="Candara, sans-serif" font-size="7.5" fill="#6b7280">works offline ✓</text>

  <!-- Server -->
  <rect x="138" y="115" width="105" height="48" rx="10" fill="#fff3e0" stroke="#e26c22" stroke-width="1.5"/>
  <text x="190" y="134" text-anchor="middle" font-family="Candara, sans-serif" font-size="10" fill="#e26c22" font-weight="bold">HTTP Server</text>
  <text x="190" y="148" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#333">N-Quads + ETag</text>
  <text x="190" y="158" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#6b7280">(e.g. Solid Pod)</text>

  <!-- Arrows: Client A → Server -->
  <line x1="80" y1="105" x2="155" y2="115" stroke="#1e64c8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="100" y="117" font-family="Candara, sans-serif" font-size="7" fill="#1e64c8">PUT</text>

  <!-- Arrows: Server → Client A -->
  <line x1="148" y1="125" x2="90" y2="105" stroke="#e26c22" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-w)"/>
  <text x="100" y="128" font-family="Candara, sans-serif" font-size="7" fill="#e26c22">GET</text>

  <!-- Arrows: Client B → Server -->
  <line x1="300" y1="105" x2="228" y2="115" stroke="#1e64c8" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="270" y="117" font-family="Candara, sans-serif" font-size="7" fill="#1e64c8">PUT</text>

  <!-- Arrows: Server → Client B -->
  <line x1="235" y1="125" x2="290" y2="105" stroke="#e26c22" stroke-width="1.2" stroke-dasharray="4,2" marker-end="url(#arr-w)"/>
  <text x="270" y="128" font-family="Candara, sans-serif" font-size="7" fill="#e26c22">GET</text>

  <!-- Merge label in middle -->
  <rect x="148" y="40" width="85" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="190" y="55" text-anchor="middle" font-family="Candara, sans-serif" font-size="8.5" fill="#2e7d32" font-weight="bold">CRDT Merge</text>
  <text x="190" y="68" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#333">commutative</text>
  <text x="190" y="77" text-anchor="middle" font-family="Candara, sans-serif" font-size="7" fill="#333">idempotent</text>

  <!-- Arrows between clients and merge -->
  <line x1="113" y1="55" x2="145" y2="58" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
  <line x1="268" y1="55" x2="236" y2="58" stroke="#2e7d32" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>
</svg>
