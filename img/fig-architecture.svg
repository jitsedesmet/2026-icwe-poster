<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 280">
  <defs>
    <marker id="a-up" markerWidth="8" markerHeight="6" refX="4" refY="0" orient="auto">
      <path d="M0,6 L4,0 L8,6 Z" fill="#1e64c8"/>
    </marker>
    <marker id="a-down" markerWidth="8" markerHeight="6" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#e26c22"/>
    </marker>
  </defs>

  <!-- The Web (top) -->
  <rect x="25" y="8" width="170" height="42" rx="8" fill="#eef4fc" stroke="#1e64c8" stroke-width="1.5"/>
  <text x="110" y="26" text-anchor="middle" font-family="Candara, sans-serif" font-size="11" fill="#1e64c8" font-weight="bold">The Web</text>
  <text x="110" y="42" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#555">RDF-over-HTTP endpoints</text>

  <!-- Arrow: Web ↔ CRDT Store -->
  <line x1="85" y1="50" x2="85" y2="72" stroke="#1e64c8" stroke-width="1.3" marker-end="url(#a-down)"/>
  <line x1="135" y1="72" x2="135" y2="50" stroke="#1e64c8" stroke-width="1.3" marker-end="url(#a-up)"/>
  <text x="45" y="66" font-family="Candara, sans-serif" font-size="7" fill="#1e64c8">GET+ETag</text>
  <text x="142" y="66" font-family="Candara, sans-serif" font-size="7" fill="#e26c22">PUT+If-Match</text>

  <!-- CRDT Store -->
  <rect x="25" y="78" width="170" height="42" rx="8" fill="#fff3e0" stroke="#e26c22" stroke-width="1.5"/>
  <text x="110" y="96" text-anchor="middle" font-family="Candara, sans-serif" font-size="11" fill="#e26c22" font-weight="bold">CRDT Store</text>
  <text x="110" y="112" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#555">OR-Set in RDF 1.2</text>

  <!-- Arrow: CRDT Store ↔ SPARQL Engine -->
  <line x1="110" y1="120" x2="110" y2="145" stroke="#1e64c8" stroke-width="1.3" marker-end="url(#a-down)"/>
  <text x="118" y="137" font-family="Candara, sans-serif" font-size="7" fill="#555">transparent</text>

  <!-- SPARQL Engine -->
  <rect x="25" y="150" width="170" height="42" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="110" y="168" text-anchor="middle" font-family="Candara, sans-serif" font-size="11" fill="#2e7d32" font-weight="bold">SPARQL Engine</text>
  <text x="110" y="184" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#555">Standard queries &amp; updates</text>

  <!-- Arrow: SPARQL Engine ↔ Agent -->
  <line x1="110" y1="192" x2="110" y2="215" stroke="#1e64c8" stroke-width="1.3" marker-end="url(#a-down)"/>
  <text x="118" y="208" font-family="Candara, sans-serif" font-size="7" fill="#555">SPARQL</text>

  <!-- Agent -->
  <rect x="25" y="220" width="170" height="42" rx="8" fill="white" stroke="#1e64c8" stroke-width="1.5"/>
  <text x="110" y="238" text-anchor="middle" font-family="Candara, sans-serif" font-size="11" fill="#1e64c8" font-weight="bold">Agent</text>
  <text x="110" y="254" text-anchor="middle" font-family="Candara, sans-serif" font-size="8" fill="#555">Application / User</text>
</svg>
