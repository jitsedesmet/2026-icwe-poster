name: Build-and-deploy


concurrency:
  group: 'pages'
  cancel-in-progress: true

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  build-and-deploy:
    uses: ./.github/workflows/build-might-deploy.yml
    with:
      deploy: true
